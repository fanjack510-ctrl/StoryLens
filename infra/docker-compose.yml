services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: storylens
      POSTGRES_USER: storylens
      POSTGRES_PASSWORD: storylens_dev
    ports:
      - "5432:5432"
    volumes:
      - storylens_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  storylens_pgdata:
