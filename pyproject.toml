[project]
name = "storylens"
version = "1.0.3"
description = "AI-assisted structured book analysis and narrative case retrieval"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "tenacity>=9.0",
  "jsonschema>=4.23",
  "keyring>=25.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]
sidecar = [
  "pyinstaller>=6.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/app"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
markers = [
  "requires_audit_assets: needs audits/single-chapter-pipeline captures or reports",
  "requires_main_db_snapshot: needs data/storylens.db with certification counts (55/2)",
  "requires_certification_artifacts: needs artifacts/single-chapter-pipeline-certification/",
  "requires_cloud_pricing: needs verified config/cloud_pricing.json (tests may install a fixture)",
  "canary_offline: defect-canary offline replay against captured batches",
  "freeze_baseline: core/UI freeze hash seals (optional until re-sealed)",
  "integration: hits real local providers, repo paths, or certification scripts",
]

[tool.ruff]
line-length = 100
target-version = "py311"
